[package]
name = "markup"
version = "0.1.0"
description = "Markup — local-first Markdown knowledge base editor"
authors = ["Markup"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "markup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
walkdir = "2"
base64 = "0.22"
thiserror = "2"
encoding_rs = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
